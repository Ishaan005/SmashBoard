name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Python (for native dependencies)
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Setup MSBuild (Windows)
      if: matrix.os == 'windows-latest'
      uses: microsoft/setup-msbuild@v1.1

    - name: Install dependencies
      run: npm ci

    - name: Rebuild native dependencies
      run: npm run rebuild:native

    - name: Run tests
      run: npm test
      continue-on-error: true

    - name: Build Next.js app
      run: npm run build:next

    - name: Build Electron app
      run: npm run build:electron

    - name: Build Electron app for macOS
      if: matrix.os == 'macos-latest'
      run: npm run dist:mac
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
        DEBUG: electron-builder

    - name: Build Electron app for Windows
      if: matrix.os == 'windows-latest'
      run: npm run dist:win
      env:
        DEBUG: electron-builder

    - name: Upload macOS artifacts
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macos-release
        path: |
          release/*.dmg
          release/*.zip
        retention-days: 7

    - name: Upload Windows artifacts
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: |
          release/*.exe
          release/*.zip
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Download macOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: macos-release
        path: release/macos

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-release
        path: release/windows

    - name: List release files
      run: |
        find release -type f -name "*.dmg" -o -name "*.exe" | head -20

    - name: Get version from package.json
      id: package-version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.package-version.outputs.version }}-${{ github.run_number }}
        name: SmashBoard v${{ steps.package-version.outputs.version }}-${{ github.run_number }}
        draft: false
        prerelease: true
        files: |
          release/macos/*.dmg
          release/macos/*.zip
          release/windows/*.exe
          release/windows/*.zip
        body: |
          ## Changes
          - Automated build from commit ${{ github.sha }}
          
          ## Downloads
          - **macOS**: Download the `.dmg` file
          - **Windows**: Download the `.exe` installer
          
          Built with:
          - Node.js 20
          - Latest Electron
          - SQLite included for both platforms